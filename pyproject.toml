[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_customer_support_agent"
version = "0.0.1"
description = "Local demo for an LLM-driven customer support agent"
authors = [ { name="Auto", email="dev@example.com" } ]
[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "RUF"]
extend-ignore = ["E203", "E501", "C901"]
